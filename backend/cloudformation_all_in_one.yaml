AWSTemplateFormatVersion: '2010-09-09'
Description: >
  matsuoka-fit-tracker All-in-One CloudFormation Template
  (Upload this single file in AWS CloudFormation Console to create DynamoDB, Lambda, HTTP API Gateway, and Cognito JWT Authorizer)

Parameters:
  ExistingCognitoRegion:
    Type: String
    Default: "ap-northeast-1"
    Description: Region of the existing Cognito User Pool
  ExistingUserPoolId:
    Type: String
    Default: "ap-northeast-1_xxxxxxxxx"
    Description: Existing Cognito User Pool ID (e.g. ap-northeast-1_xxxxxxxxx)
  ExistingUserPoolClientId:
    Type: String
    Default: "xxxxxxxxxxxxxxxxxxxxxxxxxx"
    Description: Existing Cognito User Pool App Client ID

Resources:
  # 1. DynamoDB Table
  FitnessRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: FitnessRecords
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: recordKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: recordKey
          KeyType: RANGE

  # 2. Lambda Execution IAM Role
  FitTrackerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: FitTrackerDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt FitnessRecordsTable.Arn

  # 3. Lambda Function (Inline Code)
  FitTrackerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: matsuoka-fit-tracker-api
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt FitTrackerLambdaRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref FitnessRecordsTable
          ALLOWED_ORIGIN: "*"
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from datetime import datetime, timezone
          from decimal import Decimal, InvalidOperation
          import boto3
          from boto3.dynamodb.conditions import Key

          logger = logging.getLogger(__name__)
          logger.setLevel(logging.INFO)
          TABLE_NAME = os.environ.get("TABLE_NAME", "FitnessRecords")
          ALLOWED_ORIGIN = os.environ.get("ALLOWED_ORIGIN", "*")

          class DecimalEncoder(json.JSONEncoder):
              def default(self, obj):
                  if isinstance(obj, Decimal):
                      return int(obj) if obj % 1 == 0 else float(obj)
                  return super().default(obj)

          def build_response(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "Content-Type": "application/json; charset=utf-8",
                      "Access-Control-Allow-Origin": ALLOWED_ORIGIN,
                      "Access-Control-Allow-Headers": "Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token",
                      "Access-Control-Allow-Methods": "GET,POST,OPTIONS",
                  },
                  "body": json.dumps(body, cls=DecimalEncoder, ensure_ascii=False),
              }

          def get_user_id(event):
              rc = event.get("requestContext", {})
              auth = rc.get("authorizer", {})
              claims = auth.get("jwt", {}).get("claims", {}) or auth.get("claims", {})
              return str(claims["sub"]) if "sub" in claims else None

          def resolve_timestamp(recorded_at=None):
              if recorded_at and isinstance(recorded_at, str) and recorded_at.strip():
                  try:
                      dt = datetime.fromisoformat(recorded_at.strip().replace("Z", "+00:00"))
                      dt = dt.replace(tzinfo=timezone.utc) if dt.tzinfo is None else dt.astimezone(timezone.utc)
                      return dt.strftime("%Y-%m-%dT%H:%M:%SZ")
                  except ValueError:
                      pass
              return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          def to_dec(val, default="0"):
              try:
                  return Decimal(str(val if val is not None else default))
              except (InvalidOperation, ValueError, TypeError):
                  return Decimal(default)

          def lambda_handler(event, context=None):
              rc = event.get("requestContext", {})
              http_info = rc.get("http", {})
              method = (http_info.get("method") or event.get("httpMethod") or "").upper()
              raw_path = event.get("rawPath") or event.get("path") or ""
              stage = rc.get("stage")
              if stage and raw_path.startswith(f"/{stage}/"):
                  raw_path = raw_path[len(stage) + 1:]
              path = raw_path.rstrip("/") or "/"

              if method == "OPTIONS":
                  return build_response(200, {"message": "OK"})

              user_id = get_user_id(event)
              if not user_id:
                  return build_response(401, {"error": "Unauthorized", "message": "Invalid or missing Cognito JWT"})

              table = boto3.resource("dynamodb").Table(TABLE_NAME)
              try:
                  if method == "GET" and path.endswith("/records"):
                      q = event.get("queryStringParameters") or {}
                      rec_type = (q.get("type") or "").strip().upper()
                      limit = min(500, max(1, int(q.get("limit", 200))))
                      key_cond = Key("userId").eq(user_id)
                      if rec_type in {"DIET", "WORKOUT", "BODY"}:
                          key_cond = key_cond & Key("recordKey").begins_with(f"{rec_type}#")
                      resp = table.query(KeyConditionExpression=key_cond, ScanIndexForward=False, Limit=limit)
                      items = resp.get("Items", [])
                      items.sort(key=lambda x: str(x.get("recordedAt", "")), reverse=True)
                      return build_response(200, {"records": items[:limit], "count": len(items[:limit])})

                  body = json.loads(event.get("body") or "{}")
                  recorded_at = resolve_timestamp(body.get("recordedAt"))

                  if method == "POST" and path.endswith("/records/diet"):
                      p = to_dec(body.get("protein"), "0")
                      f = to_dec(body.get("fat"), "0")
                      c = to_dec(body.get("carbs"), "0")
                      raw_cal = body.get("calories")
                      calories = int(raw_cal) if raw_cal is not None else int(round(float(p) * 4 + float(f) * 9 + float(c) * 4))
                      item = {
                          "userId": user_id,
                          "recordKey": f"DIET#{recorded_at}",
                          "recordType": "DIET",
                          "recordedAt": recorded_at,
                          "menuName": str(body.get("menuName") or "食事記録").strip(),
                          "calories": calories,
                          "protein": p,
                          "fat": f,
                          "carbs": c,
                          "syncedToCold": False,
                      }
                      if isinstance(body.get("ingredients"), list):
                          ing_list = []
                          for ing in body["ingredients"][:10]:
                              ip = to_dec(ing.get("protein"), "0")
                              if_ = to_dec(ing.get("fat"), "0")
                              ic = to_dec(ing.get("carbs"), "0")
                              ical = int(ing.get("calories", round(float(ip) * 4 + float(if_) * 9 + float(ic) * 4)))
                              ing_list.append({"name": str(ing.get("name", "")), "protein": ip, "fat": if_, "carbs": ic, "calories": ical})
                          item["ingredients"] = ing_list
                      table.put_item(Item=item)
                      return build_response(201, {"message": "食事記録を登録しました。", "record": item})

                  if method == "POST" and path.endswith("/records/workout"):
                      item = {
                          "userId": user_id,
                          "recordKey": f"WORKOUT#{recorded_at}",
                          "recordType": "WORKOUT",
                          "recordedAt": recorded_at,
                          "workoutName": str(body.get("workoutName") or "トレーニング").strip(),
                          "weight": to_dec(body.get("weight"), "0"),
                          "reps": int(body.get("reps", 1)),
                          "sets": int(body.get("sets", 1)),
                          "syncedToCold": False,
                      }
                      table.put_item(Item=item)
                      return build_response(201, {"message": "トレーニング記録を登録しました。", "record": item})

                  if method == "POST" and path.endswith("/records/body"):
                      item = {
                          "userId": user_id,
                          "recordKey": f"BODY#{recorded_at}",
                          "recordType": "BODY",
                          "recordedAt": recorded_at,
                          "bodyWeight": to_dec(body.get("bodyWeight"), "60"),
                          "syncedToCold": False,
                      }
                      if body.get("bodyFatPercentage") is not None and body.get("bodyFatPercentage") != "":
                          item["bodyFatPercentage"] = to_dec(body.get("bodyFatPercentage"))
                      table.put_item(Item=item)
                      return build_response(201, {"message": "体組成記録を登録しました。", "record": item})

                  return build_response(404, {"error": "NotFound", "message": f"Route not found: {method} {path}"})
              except Exception as exc:
                  logger.exception("Error: %s", exc)
                  return build_response(500, {"error": "InternalServerError", "message": str(exc)})

  # 4. API Gateway v2 (HTTP API) with CORS
  FitTrackerHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: matsuoka-fit-tracker-http-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 86400

  # 5. Cognito JWT Authorizer
  FitTrackerJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      Name: CognitoJwtAuthorizer
      JwtConfiguration:
        Audience:
          - !Ref ExistingUserPoolClientId
        Issuer: !Sub "https://cognito-idp.${ExistingCognitoRegion}.amazonaws.com/${ExistingUserPoolId}"

  # 6. Lambda Integration
  FitTrackerLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FitTrackerFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  # 7. Protected Routes
  RouteGetRecords:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      RouteKey: "GET /records"
      AuthorizationType: JWT
      AuthorizerId: !Ref FitTrackerJwtAuthorizer
      Target: !Sub "integrations/${FitTrackerLambdaIntegration}"

  RoutePostDiet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      RouteKey: "POST /records/diet"
      AuthorizationType: JWT
      AuthorizerId: !Ref FitTrackerJwtAuthorizer
      Target: !Sub "integrations/${FitTrackerLambdaIntegration}"

  RoutePostWorkout:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      RouteKey: "POST /records/workout"
      AuthorizationType: JWT
      AuthorizerId: !Ref FitTrackerJwtAuthorizer
      Target: !Sub "integrations/${FitTrackerLambdaIntegration}"

  RoutePostBody:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      RouteKey: "POST /records/body"
      AuthorizationType: JWT
      AuthorizerId: !Ref FitTrackerJwtAuthorizer
      Target: !Sub "integrations/${FitTrackerLambdaIntegration}"

  # 8. Auto-Deploy Stage (prod)
  FitTrackerApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref FitTrackerHttpApi
      StageName: prod
      AutoDeploy: true

  # 9. Permission for API Gateway to Invoke Lambda
  FitTrackerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FitTrackerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FitTrackerHttpApi}/*/*"

Outputs:
  ApiEndpoint:
    Description: "Copy this URL to VITE_API_BASE_URL in frontend/.env.local"
    Value: !Sub "https://${FitTrackerHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

